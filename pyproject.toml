[project]
name = "funpay-chat"
version = "0.1.0"
description = "Мониторинг чата FunPay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.0",
    "lxml>=6.1.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"

line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = false
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false